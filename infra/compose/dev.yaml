# Local development services (brief §16). Production compose lives in infra/compose/prod.yaml.
# Passwords come from infra/compose/.env, generated once by `pnpm local:env` (never committed).
name: skipa-dev

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: skipa
      POSTGRES_USER: skipa_owner
      POSTGRES_PASSWORD: ${SKIPA_OWNER_DB_PASSWORD:?run pnpm local:env first} # ggignore: variable reference, no value
      TZ: UTC
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    ports:
      - '127.0.0.1:${SKIPA_DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skipa_owner -d skipa']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
