# Staging stack (AD §12.1–12.3) on one Hetzner CPX22 (2 vCPU, 4 GB). Installed by infra/ansible at
# /srv/skipa/compose and run through deploy.sh, which passes three env files:
#   /etc/skipa/compose-staging.env  secrets (decrypted from SOPS by infra/ansible)
#   host.env                        API_HOSTNAME, CLOUDFLARE_IP_RANGES (written by infra/ansible)
#   release.env                     API_IMAGE, RELEASE (written by deploy.sh)
# For a manual command on the server use the same three, e.g.
#   docker compose -f staging.yaml --env-file /etc/skipa/compose-staging.env \
#     --env-file host.env --env-file release.env ps
#
# Only Caddy listens on the internet (80/443, firewalled to Cloudflare by ufw). Grafana and
# GlitchTip listen on 127.0.0.1 and are reached through an SSH tunnel (AD §12.2). Postgres has no
# published port at all.
#
# Not here yet, added with the milestone that needs them: worker (M1, pg-boss), prometheus and
# exporters (Infra dashboard), pgbackrest (production backups; staging holds seed data only).
name: skipa-staging

x-logging:
  &logging # Container logs go to journald; Alloy reads the journal (no Docker socket needed).
  driver: journald
  options:
    tag: '{{.Name}}'

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    # Host networking on purpose: ports Docker publishes skip the host firewall (Docker's iptables
    # rules run before ufw's), so "80/443 from Cloudflare only" would not hold. With the host
    # network, Caddy's 80/443 go through ufw like any other service (infra/ansible, roles/base).
    network_mode: host
    environment:
      API_HOSTNAME: ${API_HOSTNAME:?}
      API_UPSTREAM: 127.0.0.1:4000
      CLOUDFLARE_IP_RANGES: ${CLOUDFLARE_IP_RANGES:?}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SKIPA_SECRETS_DIR:-/etc/skipa}/tls:/etc/caddy/tls:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits: { memory: 128M }

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    env_file: ${SKIPA_SECRETS_DIR:-/etc/skipa}/staging.env
    environment:
      PORT: '4000'
      FILES_DIR: /srv/skipa/files
      # Set per deploy by deploy.sh (release.env): api@<version>+<git sha> (AD §10.1).
      RELEASE: ${RELEASE:?}
    # Loopback only: Caddy (host network) is the one way in.
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - files:/srv/skipa/files
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, data]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 512M }

  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: skipa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?} # ggignore: variable reference, no value
      TZ: UTC
    # Tuned for a 4 GB box shared with the rest of this stack (limits total ≈ 3.2 GB).
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=60
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d skipa']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [data]
    shm_size: 256m
    logging: *logging
    deploy:
      resources:
        limits: { memory: 1G }

  glitchtip:
    # Single process: web, task worker and scheduler (GlitchTip 7). Postgres only, no Valkey.
    image: glitchtip/glitchtip:7.0.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?}@postgres:5432/glitchtip # ggignore: variable reference, no value
      VALKEY_URL: ''
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?}
      GLITCHTIP_DOMAIN: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1,glitchtip
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      ENABLE_USER_REGISTRATION: 'false'
      ENABLE_ORGANIZATION_CREATION: 'false'
      # Errors are kept 24 months (AD §7.6, ER-04).
      GLITCHTIP_RETENTION_DAYS: '730'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', 'healthcheck.py']
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 5
    networks: [data, admin]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 512M }

  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [obs]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 384M }

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command: ['run', '--storage.path=/var/lib/alloy', '/etc/alloy/config.alloy']
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy
    depends_on: [loki]
    networks: [obs]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 256M }

  grafana:
    image: grafana/grafana:13.2.7
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    networks: [obs, admin]
    logging: *logging
    deploy:
      resources:
        limits: { memory: 384M }

networks:
  # edge: the API's internet egress (Paystack, email, SMS) and its loopback port for Caddy.
  # admin: the two 127.0.0.1 UIs; a port cannot be published from an internal-only network.
  edge: {}
  admin: {}
  data:
    internal: true
  obs:
    internal: true

volumes:
  caddy-data: {}
  files: {}
  pgdata: {}
  loki-data: {}
  alloy-data: {}
  grafana-data: {}
