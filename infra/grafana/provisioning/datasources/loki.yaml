# Grafana data sources (AD §10.4). Dashboards and alert rules arrive with the milestones whose
# metrics they show; Prometheus is added with the Infra dashboard.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      derivedFields:
        # Click a request ID in a log line to see every line for that request.
        - name: request_id
          matcherRegex: '"request_id":"([0-9a-f-]+)"'
          datasourceUid: loki
          url: '{service=~".+"} |= "$${__value.raw}"'
