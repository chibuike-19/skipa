      - version
      - generatedAt
      - categories
      - products
    CartLineInput:
      type: object
      additionalProperties: false
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        expectedUnitPriceKobo:
          type: integer
          minimum: 0
          format: int64
          description: "Amount in kobo (₦1 = 100 kobo)."
      required:
      - productId
      - quantity
    CartSnapshot:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CartLineInput"
        clientUpdatedAt:
          type: string
          format: date-time
        lastScreen:
          type: string
      required:
      - items
      - clientUpdatedAt
    CartQuote:
      type: object
      additionalProperties: false
      properties:
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              productId:
                type: string
                format: uuid
              name:
                type: string
              quantity:
                type: integer
              unitPriceKobo:
                type: integer
                minimum: 0
                format: int64
                description: "Amount in kobo (₦1 = 100 kobo)."
              lineTotalKobo:
                type: integer
                minimum: 0
                format: int64
                description: "Amount in kobo (₦1 = 100 kobo)."
            required:
            - productId
            - name
            - quantity
            - unitPriceKobo
            - lineTotalKobo
        itemCount:
          type: integer
        totalKobo:
          type: integer
          minimum: 0
          format: int64
          description: "Amount in kobo (₦1 = 100 kobo)."
        priceChanges:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              productId:
                type: string
                format: uuid
              oldPriceKobo:
                type: integer
                minimum: 0
                format: int64
                description: "Amount in kobo (₦1 = 100 kobo)."
              newPriceKobo:
                type: integer
                minimum: 0
                format: int64
                description: "Amount in kobo (₦1 = 100 kobo)."
            required:
            - productId
            - oldPriceKobo
            - newPriceKobo
        blocked:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              productId:
                type: string
                format: uuid
              reason:
                type: string
                enum:
                - till_only
                - category_off
                - price_updating
                - not_ready
            required:
            - productId
            - reason
        limitExceeded:
          oneOf:
          - type: string
            enum:
            - value
            - items
          - type: "null"
      required:
      - lines
      - itemCount
      - totalKobo
      - priceChanges
      - blocked
      - limitExceeded
    UnknownBarcodeBatch:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              clientEventId:
                type: string
                format: uuid
              barcode:
                type: string
              reason:
                type: string
                enum:
                - not_found
                - category_off
                - till_only
                - price_stale
                - missing_weight
              typed:
                type: boolean
              scannedAt:
                type: string
                format: date-time
            required:
            - clientEventId
            - barcode
            - reason
            - typed
            - scannedAt
      required:
      - items
    CreateOrder:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CartLineInput"
        channel:
          type: string
          enum:
          - card
          - bank_transfer
          - ussd
      required:
      - sessionId
      - items
      - channel
    OrderItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        barcode:
          type: string
        quantity:
          type: integer
        unitPriceKobo:
          type: integer
          minimum: 0
          format: int64
          description: "Amount in kobo (₦1 = 100 kobo)."
        lineTotalKobo:
          type: integer
          minimum: 0
          format: int64
          description: "Amount in kobo (₦1 = 100 kobo)."
        categoryName:
          type: string
      required:
      - id
      - name
      - quantity
      - unitPriceKobo
      - lineTotalKobo
      - categoryName
    Order:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
