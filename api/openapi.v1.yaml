      - qrCode
    ShoppingSession:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
        branch:
          "$ref": "#/components/schemas/BranchPublic"
        status:
          type: string
          enum:
          - active
          - switched_off
          - payments_unavailable
        catalogueVersion:
          type: integer
        limits:
          type: object
          additionalProperties: false
          properties:
            maxValueKobo:
              type: integer
              minimum: 0
              format: int64
              description: "Amount in kobo (₦1 = 100 kobo)."
            maxItems:
              type: integer
          required:
          - maxValueKobo
          - maxItems
        paymentChannels:
          type: array
          items:
            type: string
            enum:
            - card
            - bank_transfer
            - ussd
        exitWindowMinutes:
          type: integer
        sessionTimeoutMinutes:
          type: integer
      required:
      - sessionId
      - branch
      - status
      - catalogueVersion
      - limits
      - paymentChannels
      - exitWindowMinutes
    CatalogueProduct:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        barcode:
          type: string
        name:
          type: string
        priceKobo:
          type: integer
          minimum: 0
          format: int64
          description: "Amount in kobo (₦1 = 100 kobo)."
        categoryId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - available
          - till_only
          - category_off
          - price_updating
          - not_ready
      required:
      - id
      - barcode
      - name
      - priceKobo
      - categoryId
      - status
    Catalogue:
      type: object
      additionalProperties: false
      properties:
        branchId:
          type: string
          format: uuid
        version:
          type: integer
        generatedAt:
          type: string
          format: date-time
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              active:
                type: boolean
            required:
            - id
            - name
            - active
        products:
          type: array
          items:
            "$ref": "#/components/schemas/CatalogueProduct"
