      - store
      - branchName
      - issuedAt
      - items
      - totalKobo
      - paymentMethod
      - exit
    ReceiptListItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        receiptNumber:
          type: string
        storeName:
          type: string
        branchName:
          type: string
        issuedAt:
          type: string
          format: date-time
