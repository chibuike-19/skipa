  version: "1.0.0"
  summary: Contract between the Skipa backend and its web and native clients.
  description: "Source of truth for the frontend and backend agents. Generated from the Zod schemas in `packages/contracts` once the repo exists; until then this file is edited by hand and the Zod schemas are written to match it. Changing this file requires a PR labelled `contract-change` reviewed by both agents.\n\nConventions: JSON camelCase; money as integer kobo in fields ending `Kobo`; times ISO-8601 UTC (display in WAT); cursor pagination (`cursor`, `limit` ≤ 100, response `{data, nextCursor}`); errors `{error:{code,message,userMessage,requestId}}` with codes from the error catalogue (PRD 14.2); `Idempotency-Key` (UUID) required where listed — replays within 24 h return the first response; every response carries `X-Request-Id`. Versioning: breaking changes only under a new prefix (`/v2`); `/v1` supported ≥ 6 months after `/v2` ships (NF-25)."
  contact:
    name: Skipa engineering
servers:
- url: "https://api.skipa.ng"
  description: Production (domain to confirm)
- url: "https://api.staging.skipa.ng"
  description: "Staging — Paystack test keys"
- url: "http://localhost:4000"
  description: Local
