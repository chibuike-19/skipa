components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Opaque session token (native apps; exit devices)."
    cookie:
      type: apiKey
      in: cookie
      name: __Host-skipa_sid
      description: "httpOnly session cookie for the web apps. Mutating requests must also send `X-Skipa-Client`."
    deviceToken:
      type: apiKey
      in: header
      name: X-Skipa-Device
      description: Signed device token from POST /v1/devices (guests).
    paystackSignature:
      type: apiKey
      in: header
      name: x-paystack-signature
      description: HMAC-SHA512 of the raw body with the Paystack secret key.
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: "Provider-specific signature or shared secret, verified per provider."
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      description: "Optional client-generated ID; the edge generates one if absent (ER-03)."
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: "Required. Same key + same body within 24 h returns the original response (CS-03, PY-01)."
  headers:
    RequestId:
      schema:
        type: string
      description: "Request ID (also in logs, errors and Paystack metadata)."
  responses:
    E400:
      description: Validation failed
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: SYS-400
              message: "body/items/0/quantity must be >= 1"
              userMessage: "Something in that request wasn't right."
              requestId: "91c0-44ad"
    E401:
      description: Not signed in or session expired
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: AUTH-001
              message: session expired
              userMessage: Please sign in again.
              requestId: "91c0-44ad"
    E403:
      description: "Not allowed for this role, branch or organisation"
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: AUTH-005
              message: branch not assigned
              userMessage: "You don't have access to this branch."
              requestId: "91c0-44ad"
    E404:
      description: Not found
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: SYS-404
              message: not found
              userMessage: "We couldn't find that."
              requestId: "91c0-44ad"
    E409:
      description: "Conflict: state changed, price changed, or idempotency key reused with a different body"
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: CART-006
              message: prices changed
              userMessage: Some prices changed. Check your cart before paying.
              requestId: "91c0-44ad"
    E429:
      description: Rate limited
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: AUTH-004
              message: too many attempts
              userMessage: Too many tries. Wait 15 minutes and try again.
              requestId: "91c0-44ad"
    E500:
      description: Unexpected error
      headers:
        X-Request-Id:
          "$ref": "#/components/headers/RequestId"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: SYS-500
              message: unexpected
              userMessage: Something went wrong on our side.
              requestId: "91c0-44ad"
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: "^[A-Z]{3,6}-[0-9]{3}$"
              examples:
              - PAY-007
            message:
              type: string
            userMessage:
              type: string
              description: Plain-English message safe to show (ER-07).
            requestId:
              type: string
              description: Short reference shown to users (ER-08).
            details:
              type: object
          required:
          - code
          - message
          - userMessage
          - requestId
      required:
      - error
    Device:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          format: uuid
        deviceToken:
          type: string
          description: "Signed token; send as X-Skipa-Device."
      required:
      - deviceId
      - deviceToken
    DeviceRegistration:
      type: object
      additionalProperties: false
      properties:
        platform:
          type: string
          enum:
          - web
          - ios
          - android
        appVersion:
          type: string
        browser:
          type: string
      required:
      - platform
      - appVersion
    OtpRequest:
      type: object
      additionalProperties: false
      properties:
        destination:
          type: string
          description: "E.164 phone (+234…) for shoppers, email for staff."
        purpose:
          type: string
          enum:
          - shopper_register
          - shopper_sign_in
          - staff_sign_in
          - admin_sign_in
        surface:
          type: string
          enum:
          - exit
          - store
          - admin
        inviteToken:
          type: string
      required:
      - destination
      - purpose
    OtpChallenge:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        destinationMasked:
          type: string
        expiresAt:
          type: string
          format: date-time
        resendAfter:
          type: string
          format: date-time
      required:
      - challengeId
      - destinationMasked
      - expiresAt
      - resendAfter
    OtpVerify:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
        exitDeviceLabel:
          type: string
      required:
      - challengeId
      - code
    Session:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: Opaque token. Web apps also receive it as an httpOnly cookie.
        expiresAt:
          type: string
          format: date-time
        surface:
          type: string
          enum:
          - shopper
          - exit
          - store
          - admin
        secondStepRequired:
          type: boolean
      required:
      - token
      - expiresAt
      - surface
    ShopperRegistration:
      type: object
      additionalProperties: false
      properties:
        registrationToken:
          type: string
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        privacyNoticeVersion:
          type: string
        marketingConsent:
          type: boolean
        emailReceipts:
          type: boolean
        claimGuestStars:
          type: boolean
      required:
      - registrationToken
      - name
      - privacyNoticeVersion
      - marketingConsent
    ShopperProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phoneMasked:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: "null"
        avatar:
          type: string
          enum:
          - tomi
          - mimi
          - ata
          - lubo
          - sardi
        emailReceipts:
          type: boolean
        starsTotal:
          type: integer
        marketingConsent:
          type: boolean
      required:
      - id
      - name
      - phoneMasked
      - avatar
      - emailReceipts
      - starsTotal
    ShopperPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: "null"
        avatar:
          type: string
          enum:
          - tomi
          - mimi
          - ata
          - lubo
          - sardi
        emailReceipts:
          type: boolean
        marketingConsent:
          type: boolean
    StaffMe:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - exit_checker
          - store_manager
          - head_office_admin
          - super_admin
          - support_agent
        organisationId:
          oneOf:
          - type: string
            format: uuid
          - type: "null"
        branchIds:
          type: array
          items:
            type: string
            format: uuid
        permissions:
          type: array
          items:
            type: string
        plan:
          type: string
          enum:
          - pilot
          - paid
      required:
      - id
      - name
      - email
      - role
      - organisationId
      - branchIds
      - permissions
    BrandTokens:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
        logoSquareUrl:
          oneOf:
          - type: string
          - type: "null"
        logoWideUrl:
          oneOf:
          - type: string
          - type: "null"
        coverUrl:
          oneOf:
          - type: string
          - type: "null"
        primary:
          type: string
        primaryHover:
          type: string
        primaryPressed:
          type: string
        onPrimary:
          type: string
        primaryText:
          type: string
        primarySubtle:
          type: string
        accent:
          type: string
        onAccent:
          type: string
        accentSubtle:
          type: string
        welcomeMessage:
          type: string
        receiptHeader:
          type: string
        receiptFooter:
          type: string
        socialLinks:
          type: object
      required:
      - displayName
      - primary
      - onPrimary
      - primaryText
      - accent
      - onAccent
    BranchPublic:
      type: object
      additionalProperties: false
      properties:
        branchId:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        storeName:
          type: string
        branchName:
          type: string
        area:
          type: string
        address:
          type: string
        latitude:
          oneOf:
          - type: number
          - type: "null"
        longitude:
          oneOf:
          - type: number
          - type: "null"
        openingHours:
          type: object
        skipaStatus:
          type: string
          enum:
          - "on"
          - "off"
          - payments_unavailable
        brand:
          "$ref": "#/components/schemas/BrandTokens"
        serviceDesk:
          type: string
        phone:
          type: string
      required:
      - branchId
      - organisationId
      - storeName
      - branchName
      - area
      - skipaStatus
      - brand
    CheckInRequest:
      type: object
      additionalProperties: false
      properties:
        qrCode:
          type: string
          pattern: "^QR-[A-Z]{2,4}-[A-Z]{3}-[0-9]{2}$"
