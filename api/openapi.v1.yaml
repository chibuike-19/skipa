          - exited
          - refund_requested
          - awaiting_head_office
          - refunded
          - partially_refunded
          - disputed
          - chargeback_won
          - chargeback_lost
        itemCount:
          type: integer
        channel:
          type: string
        flagged:
          type: boolean
        phoneMasked:
          oneOf:
          - type: string
          - type: "null"
