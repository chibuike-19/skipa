# CI (AD §12.4): install, format, lint, typecheck, unit tests, integration tests on Postgres 18.7,
# the contract check, security scans (Gitleaks, Semgrep, Trivy, pnpm audit, SOPS guard) and the
# PR-title commit check. The frontend agent adds its jobs through PRs.
name: ci

on:
  pull_request:
    # labeled/unlabeled: re-run the contract job when `contract-change` is added or removed.
    # edited: re-run the PR-title check when the title changes.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in a later step; the store is cached by hand.
          package-manager-cache: false
      - name: Activate pnpm from packageManager
        run: corepack enable && pnpm --version
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  ui:
    # Frontend (brief §7 F0, §8.2, §13): CSS colour lint, then the component gallery screenshotted in
    # the three brand modes (Skipa, Adunni Mart, Harbour Grocers) with axe on every page and overlay.
    # Runs in the Playwright image on x64 so screenshots render the same way every run. Missing
    # baselines are written and uploaded as the `ui-screenshots` artifact, and the job fails until
    # they are reviewed and committed to packages/ui/e2e/__screenshots__.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in a later step.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:css
      - run: pnpm tokens:build
      - name: Gallery screenshots (three brand modes) and axe
        working-directory: packages/ui
        run: pnpm exec playwright test -c e2e/playwright.config.ts --update-snapshots=missing
      - name: Screenshot baselines are committed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          new=$(git status --porcelain --untracked-files=all packages/ui/e2e/__screenshots__)
          if [ -n "$new" ]; then
            echo "::error::New screenshot baselines were written. Download the ui-screenshots artifact, compare with the canvas, and commit them."
            echo "$new"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: packages/ui/e2e/__screenshots__
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-playwright-report
          path: |
            packages/ui/dist/playwright-report
            packages/ui/dist/test-results

  integration:
    # Real Postgres 18.7, every migration applied to an empty database, then the int suite
    # (append-only, partial unique indexes, RLS isolation, Drizzle schema drift).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: skipa
          POSTGRES_USER: skipa_owner
          POSTGRES_PASSWORD: ci_owner_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skipa_owner -d skipa"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Throwaway credentials for the CI service container only; not secrets.
      APP_ENV: test
      DATABASE_MIGRATION_URL: postgres://skipa_owner:ci_owner_only@127.0.0.1:5432/skipa
      DATABASE_URL: postgres://skipa_app:ci_app_only@127.0.0.1:5432/skipa
      DATABASE_PLATFORM_URL: postgres://skipa_platform:ci_platform_only@127.0.0.1:5432/skipa
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in a later step; the store is cached by hand.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Migrate an empty database
        run: pnpm db:migrate
      - name: Seed it (M0 AC; throwaway keys generated per run)
        run: |
          PII_ENCRYPTION_KEY="$(openssl rand -base64 32)" PII_HMAC_KEY="$(openssl rand -base64 32)" pnpm db:seed
      - run: pnpm test:int

  contract:
    # Brief §5: the committed contract must equal what packages/contracts generates, the pack
    # fixtures must validate against it, and any change in meaning versus the base branch needs
    # the `contract-change` label (and the other agent's approval).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in a later step; the store is cached by hand.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generated contract matches the committed file
        run: pnpm contract:check
      - name: Python tools for contract checks
        # A venv, not pip --user: `python3 -I` below skips the user site-packages directory.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.3 jsonschema==4.25.1
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Pack fixtures validate against the contract
        run: |
          mkdir -p "$RUNNER_TEMP/fx/mocks" "$RUNNER_TEMP/fx/api"
          cp -r docs/architecture-pack/mocks/fixtures "$RUNNER_TEMP/fx/mocks/"
          cp docs/architecture-pack/mocks/validate_fixtures.py "$RUNNER_TEMP/fx/mocks/"
          cp api/openapi.v1.yaml "$RUNNER_TEMP/fx/api/"
          python3 -I "$RUNNER_TEMP/fx/mocks/validate_fixtures.py"
      - name: Contract changes need the contract-change label
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'contract-change') }}
        run: |
          git show "origin/${BASE_REF}:api/openapi.v1.yaml" > "$RUNNER_TEMP/base.yaml"
          if python3 -I scripts/contract_diff.py "$RUNNER_TEMP/base.yaml" api/openapi.v1.yaml; then
            echo "No change in meaning."
          elif [ "$HAS_LABEL" = "true" ]; then
            echo "::notice::Contract changed; labelled contract-change. The other agent must approve."
          else
            echo "::error::api/openapi.v1.yaml changed in meaning. Add the contract-change label and get the other agent's approval."
            exit 1
          fi

  security:
    # Brief §12: Gitleaks, Semgrep CE, pnpm audit and Trivy; plain secrets never committed.
    # Tool versions are pinned and match what was run locally before this job was added.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Gitleaks scans the whole history
      - name: Gitleaks (git history)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: SOPS files are encrypted
        run: sh scripts/check-sops-encrypted.sh
      - name: Semgrep CE
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.187.0
          semgrep scan --metrics=off --config p/typescript --config p/nodejs --config p/secrets
          --exclude node_modules --exclude docs/architecture-pack --error
      - name: Trivy (dependencies, secrets, misconfiguration)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.76.2 fs --quiet
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /repo
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in a later step; the store is cached by hand.
          package-manager-cache: false
      - run: corepack enable
      - name: pnpm audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

  infra:
    # infra/ only runs for real on a server, so check here that every file still parses: the deploy
    # script, the compose file, Caddy, Alloy and the Ansible playbook (syntax + ansible-lint).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Scratch folder
        run: echo "CHECK_DIR=$RUNNER_TEMP/infra-check" >> "$GITHUB_ENV"
      - name: Shellcheck
        run: shellcheck infra/compose/deploy.sh scripts/*.sh
      - name: Throwaway env files and certificate (names only matter, values are fake)
        run: |
          mkdir -p "$CHECK_DIR/tls"
          printf '%s=fake\n' PG_SUPERUSER_PASSWORD GLITCHTIP_DB_PASSWORD GLITCHTIP_SECRET_KEY \
            GRAFANA_ADMIN_PASSWORD > "$CHECK_DIR/compose-staging.env"
          : > "$CHECK_DIR/staging.env"
          printf 'API_HOSTNAME=api.example.test\nCLOUDFLARE_IP_RANGES=192.0.2.0/24 2001:db8::/32\n' \
            > "$CHECK_DIR/host.env"
          printf 'API_IMAGE=skipa-api:ci\nRELEASE=api@0.0.0+ci\n' > "$CHECK_DIR/release.env"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 \
            -subj /CN=api.example.test -keyout "$CHECK_DIR/tls/origin.key" \
            -out "$CHECK_DIR/tls/origin.pem" 2>/dev/null
      - name: Compose file resolves
        run: >-
          SKIPA_SECRETS_DIR="$CHECK_DIR" docker compose -f infra/compose/staging.yaml
          --env-file "$CHECK_DIR/compose-staging.env" --env-file "$CHECK_DIR/host.env"
          --env-file "$CHECK_DIR/release.env" config --quiet
      - name: Caddyfile is valid
        run: >-
          docker run --rm -e API_HOSTNAME=api.example.test -e API_UPSTREAM=127.0.0.1:4000
          -e "CLOUDFLARE_IP_RANGES=192.0.2.0/24 2001:db8::/32"
          -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$CHECK_DIR/tls:/etc/caddy/tls:ro"
          caddy:2.11.9 caddy validate --config /etc/caddy/Caddyfile
      - name: Alloy config is valid
        run: >-
          docker run --rm -v "$PWD/infra/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.22.0 validate /etc/alloy/config.alloy
      - name: Ansible tools
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet ansible-core==2.21.6 ansible-lint==26.11.1
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: Ansible playbook (syntax and lint)
        working-directory: infra/ansible
        env:
          SKIPA_HOST: 192.0.2.10
        run: |
          ansible-galaxy collection install -r requirements.yml -p .collections
          ansible-playbook -i inventory/staging.yml site.yml --syntax-check
          ansible-lint --offline site.yml

  pr-title:
    # PRs are squash-merged, so the PR title becomes the commit on main (AD §5.3).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack in a later step; the store is cached by hand.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint PR title as a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint
